name: containers

on:
  push:
    branches: [main]
    paths:
      - "oc-base/**"
      - "oc-node/**"
      - "oc-python/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      force:
        description: Force build
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * 1"

jobs:
  check:
    name: Check upstream version
    runs-on: ubuntu-latest

    outputs:
      update_needed: ${{ steps.compare.outputs.update_needed }}
      version: ${{ steps.upstream.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Restore version cache
        uses: actions/cache/restore@v6
        with:
          path: .opencode_version
          key: opencode-version

      - name: Get upstream version
        id: upstream
        run: |
          VERSION=$(
            git ls-remote --tags https://github.com/anomalyco/opencode.git \
              | awk -F/ '{print $3}' \
              | grep -E '^v2\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' \
              | sort -V \
              | tail -1
          )

          if [ -z "$VERSION" ]; then
            echo "Failed to determine upstream version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $VERSION"

      - name: Compare version
        id: compare
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          PREV_VERSION=""

          if [ -f .opencode_version ]; then
            PREV_VERSION=$(cat .opencode_version)
          fi

          echo "Previous version: ${PREV_VERSION:-none}"
          echo "Current version:  $VERSION"

          if [ "$PREV_VERSION" = "$VERSION" ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION" > .opencode_version
          fi

      - name: Save version cache
        if: steps.compare.outputs.update_needed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .opencode_version
          key: opencode-version

  build:
    name: Build (${{ matrix.dir }})
    needs: check
    if: needs.check.outputs.update_needed == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dir:
          - oc-base
          - oc-node
          - oc-python

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd "${{ matrix.dir }}"

          IMAGE="${IMAGE_PREFIX}/agent/${{ matrix.dir }}"

          docker buildx bake \
            --allow=fs.read=.. \
            -f compose.yaml \
            -f compose.override.yaml \
            --set '*.platform=linux/amd64,linux/arm64' \
            --set "*.tags=${IMAGE}:${VERSION},${IMAGE}:latest" \
            --push

      - name: Verify image
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          IMAGE="${IMAGE_PREFIX}/agent/${{ matrix.dir }}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:latest"

  skipped:
    name: Skip
    needs: check
    if: needs.check.outputs.update_needed != 'true'
    runs-on: ubuntu-latest

    steps:
      - run: echo "🚫 No changes detected, build skipped."
